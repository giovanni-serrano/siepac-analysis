name: Publicar visualizador en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar sitio público
        shell: bash
        run: |
          mkdir -p _site/graficos _site/docs
          mkdir -p _site/salidas/tesis/figuras _site/salidas/tesis/tablas
          cp index.html _site/index.html
          cp graficos/visualizador_siepac.html _site/graficos/
          cp docs/resumen_indicadores_SIEPAC.md _site/docs/
          cp salidas/tesis/figuras/*.png _site/salidas/tesis/figuras/
          cp salidas/tesis/tablas/*.html _site/salidas/tesis/tablas/
          cp salidas/tesis/tablas/*.csv _site/salidas/tesis/tablas/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
